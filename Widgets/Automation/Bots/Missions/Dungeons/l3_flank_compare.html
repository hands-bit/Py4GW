<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SoO L3 Flank Comparison</title>
<style>
body{margin:0;background:#1a1a2e;font-family:monospace;color:#eee}
h1{text-align:center;margin:10px 0 0;font-size:18px}
.legend{display:flex;justify-content:center;gap:20px;padding:8px;font-size:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
canvas{display:block;margin:0 auto;cursor:crosshair}
#tooltip{position:fixed;background:rgba(0,0,0,0.85);color:#fff;padding:4px 8px;font-size:11px;border-radius:4px;pointer-events:none;display:none}
</style></head><body>
<h1>SoO Level 3 — Flank Coordinate Comparison</h1>
<div class="legend">
  <span><span class="dot" style="background:#e63946"></span> Full Party Path</span>
  <span><span class="dot" style="background:#ff9800"></span> Old Flank (P5-P7)</span>
  <span><span class="dot" style="background:#00e676"></span> NEW Flank (P5-P7)</span>
  <span><span class="dot" style="background:#888"></span> Unchanged waypoints</span>
</div>
<canvas id="map" width="1400" height="900"></canvas>
<div id="tooltip"></div>
<script>
// Full party path with OLD flank at P5-P7
const partyPathOld = [
  [-1123.5,7481.9], [-2964.1,7302.1], [-3139.7,7022.7], [-4152.0,6469.6],
  [-3896.0,5481.0], [-3906.0,4796.0], [-4411.0,4272.0],  // OLD P5,P6,P7
  [-6364.0,4925.0], [-6838.3,3495.2],
  [-7845.7,4397.5], [-8049.0,5403.5], [-9049.9,5289.2], [-10051.1,4604.6],
  [-11057.4,4039.1], [-10381.7,3037.7]
];

// NEW flank coordinates replacing P5,P6,P7
const newFlankPts = [
  [-3716.0, 5706.0], [-3094.0, 4714.0], [-4418.0, 3966.0]
];

// Full party path with NEW flank at P5-P7
const partyPathNew = [
  [-1123.5,7481.9], [-2964.1,7302.1], [-3139.7,7022.7], [-4152.0,6469.6],
  ...newFlankPts,  // NEW P5,P6,P7
  [-6364.0,4925.0], [-6838.3,3495.2],
  [-7845.7,4397.5], [-8049.0,5403.5], [-9049.9,5289.2], [-10051.1,4604.6],
  [-11057.4,4039.1], [-10381.7,3037.7]
];

// Old flank segment (P4 -> old P5,P6,P7 -> P8)
const oldFlankSegment = [
  [-4152.0,6469.6],
  [-3896.0,5481.0], [-3906.0,4796.0], [-4411.0,4272.0],
  [-6364.0,4925.0]
];

// New flank segment (P4 -> new P5,P6,P7 -> P8)
const newFlankSegment = [
  [-4152.0,6469.6],
  [-3716.0, 5706.0], [-3094.0, 4714.0], [-4418.0, 3966.0],
  [-6364.0,4925.0]
];

const all = [...partyPathOld, ...newFlankPts];
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
for(const[x,y]of all){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
const pad=1500;minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;

const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
function tx(x){return((x-minX)/(maxX-minX))*(W-80)+40}
function ty(y){return H-(((y-minY)/(maxY-minY))*(H-80)+40)}

// Grid
ctx.strokeStyle='#2a2a4a';ctx.lineWidth=0.5;
for(let gx=Math.ceil(minX/2000)*2000;gx<=maxX;gx+=2000){
  const sx=tx(gx);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
  ctx.fillStyle='#555';ctx.font='9px monospace';ctx.fillText(gx,sx+2,H-4);
}
for(let gy=Math.ceil(minY/2000)*2000;gy<=maxY;gy+=2000){
  const sy=ty(gy);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
  ctx.fillStyle='#555';ctx.font='9px monospace';ctx.fillText(gy,2,sy-2);
}

// Draw full path (dimmed)
ctx.strokeStyle='#888';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();
for(let i=0;i<partyPathNew.length;i++){
  const px=tx(partyPathNew[i][0]),py=ty(partyPathNew[i][1]);
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.stroke();ctx.setLineDash([]);

// Draw old flank segment
ctx.strokeStyle='#ff9800';ctx.lineWidth=3;ctx.setLineDash([8,4]);ctx.beginPath();
for(let i=0;i<oldFlankSegment.length;i++){
  const px=tx(oldFlankSegment[i][0]),py=ty(oldFlankSegment[i][1]);
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.stroke();ctx.setLineDash([]);

// Draw new flank segment (highlighted)
ctx.strokeStyle='#00e676';ctx.lineWidth=3.5;ctx.beginPath();
for(let i=0;i<newFlankSegment.length;i++){
  const px=tx(newFlankSegment[i][0]),py=ty(newFlankSegment[i][1]);
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.stroke();

// Glow effect on new path
ctx.strokeStyle='rgba(0,230,118,0.25)';ctx.lineWidth=10;ctx.beginPath();
for(let i=0;i<newFlankSegment.length;i++){
  const px=tx(newFlankSegment[i][0]),py=ty(newFlankSegment[i][1]);
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.stroke();

// Draw all unchanged points (grey)
for(let i=0;i<partyPathNew.length;i++){
  // Skip P5-P7 (index 4,5,6) — drawn separately
  if(i>=4&&i<=6)continue;
  const px=tx(partyPathNew[i][0]),py=ty(partyPathNew[i][1]);
  ctx.fillStyle='#888';ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#aaa';ctx.font='9px monospace';
  ctx.fillText(`P${i+1}`,px+6,py-4);
}

// Draw old flank points (orange)
const oldPts=[[-3896.0,5481.0],[-3906.0,4796.0],[-4411.0,4272.0]];
for(let i=0;i<oldPts.length;i++){
  const px=tx(oldPts[i][0]),py=ty(oldPts[i][1]);
  ctx.fillStyle='#ff9800';ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#ff9800';ctx.font='bold 10px monospace';
  ctx.fillText(`OLD P${i+5} (${oldPts[i][0]}, ${oldPts[i][1]})`,px+8,py-6);
}

// Draw new flank points (green, larger)
for(let i=0;i<newFlankPts.length;i++){
  const px=tx(newFlankPts[i][0]),py=ty(newFlankPts[i][1]);
  // Glow
  ctx.fillStyle='rgba(0,230,118,0.3)';ctx.beginPath();ctx.arc(px,py,12,0,Math.PI*2);ctx.fill();
  // Point
  ctx.fillStyle='#00e676';ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#00e676';ctx.font='bold 11px monospace';
  ctx.fillText(`NEW P${i+5} (${newFlankPts[i][0]}, ${newFlankPts[i][1]})`,px+10,py-8);
}

// P4 and P8 labels (anchor points)
const p4=[-4152.0,6469.6],p8=[-6364.0,4925.0];
ctx.fillStyle='#fff';ctx.font='bold 10px monospace';
ctx.fillText('P4 (anchor)',tx(p4[0])+8,ty(p4[1])+14);
ctx.fillText('P8 (anchor)',tx(p8[0])+8,ty(p8[1])+14);

// Tooltip
const tooltip=document.getElementById('tooltip');
const allPts=[...partyPathOld,...newFlankPts];
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const gx=minX+(mx-40)/(W-80)*(maxX-minX);
  const gy=maxY-(my-40)/(H-80)*(maxY-minY);
  let near=null,bestD=Infinity;
  allPts.forEach(pt=>{const d=Math.hypot(tx(pt[0])-mx,ty(pt[1])-my);if(d<bestD){bestD=d;near=pt;}});
  let text=`(${Math.round(gx)}, ${Math.round(gy)})`;
  if(near&&bestD<15)text+=` | Waypoint (${near[0]}, ${near[1]})`;
  tooltip.style.display='block';tooltip.style.left=e.clientX+12+'px';tooltip.style.top=e.clientY+12+'px';tooltip.textContent=text;
});
canvas.addEventListener('mouseleave',()=>tooltip.style.display='none');
</script></body></html>
