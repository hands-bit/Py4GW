<!DOCTYPE html>
<html>
<head>
<title>SoO Level 3 - 2D Map</title>
<style>
  body { margin: 0; background: #1a1a2e; font-family: monospace; color: #eee; }
  h1 { text-align: center; margin: 10px 0 0; font-size: 18px; color: #e0e0e0; }
  .legend { display: flex; justify-content: center; gap: 20px; padding: 8px; font-size: 12px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  canvas { display: block; margin: 0 auto; cursor: crosshair; }
  #tooltip { position: fixed; background: rgba(0,0,0,0.85); color: #fff; padding: 4px 8px; font-size: 11px; border-radius: 4px; pointer-events: none; display: none; }
</style>
</head>
<body>
<h1>Shards of Orr Level 3 — Full Route</h1>
<div class="legend">
  <span><span class="dot" style="background:#00b4d8"></span> Blessing</span>
  <span><span class="dot" style="background:#ff6b35"></span> Path Before Flag (26 pts)</span>
  <span><span class="dot" style="background:#e63946"></span> Party Path (torch split) (14 pts)</span>
  <span><span class="dot" style="background:#9b5de5"></span> the torch runner Torch Backtrack (6 pts)</span>
  <span><span class="dot" style="background:#ffd166"></span> Brazier Route (10 pts)</span>
  <span><span class="dot" style="background:#f77f00"></span> Boss Path (9 pts)</span>
  <span><span class="dot" style="background:#06d6a0"></span> Path to Fendi (9 pts)</span>
  <span><span class="dot" style="background:#2ec4b6;border-radius:0;width:12px;height:12px;transform:rotate(45deg)"></span> Key Markers</span>
</div>
<canvas id="map" width="1400" height="900"></canvas>
<div id="tooltip"></div>
<script>
// Blessing
const blessing = [[17544, 18810]];

// Path before flag (main clear path)
const pathBeforeFlag = [
  [17544.5,18530.2], [17231.2,17523.3], [16811.3,16513.4], [15803.0,17071.6],
  [15004.8,18075.5], [13998.4,18866.7], [12990.9,19299.5], [11988.8,19353.2],
  [10986.4,19188.9], [9985.7,18719.2], [9402.1,17715.6], [9076.9,17383.4],
  [9133.0,16373.0], [8496.5,15367.3], [7978.0,14357.9], [7105.7,13350.9],
  [6236.1,12349.0], [5524.4,11344.1], [4813.8,10340.7], [4095.0,9332.7],
  [3091.4,8424.8], [2078.2,8286.5], [1926,5848], [1069.7,8045.3],
  [619.8,7044.0], [-385.8,6478.3]
];

// Party path during torch split (path2_part2)
const partyPath = [
  [-1123.5,7481.9], [-2964.1,7302.1], [-3139.7,7022.7], [-4152.0,6469.6],
  [-3716.0,5706.0], [-3094.0,4714.0], [-4418.0,3966.0], [-6364.0,4925.0],
  [-6633.0,5849.0],  // new detour N to cover missed enemy group
  [-6838.3,3495.2],
  [-7845.7,4397.5], [-8049.0,5403.5], [-9049.9,5289.2], [-10051.1,4604.6],
  [-11057.4,4039.1], [-10381.7,3037.7]
];
// Strict-flank waypoints (P5, P6) — hard-forced 10s hold each
const strictFlankIndices = [4, 5];   // 0-indexed positions in partyPath

// the torch runner torch backtrack
const runnerTorchPath = [
  [1962.00,7079.00], [3089.73,8511.00], [4963.00,9974.00],
  [9918.64,19108.00], [14709.00,19526.00], [16111.00,17556.00]
];

// Brazier route (BDS_L3)
const brazierRoute = [
  [15692,17111], [12969,19842], [8236,16950], [5549,9920],
  [-536,6109], [-3814,5599], [-4959,7558], [-7532,4536],
  [-10984,486], [-12621,2948]
];

// Boss approach
const bossApproach = [
  [-11878.79,2166.51], [-9686.32,2632], [-9252.32,6396.40]
];

// Path to Fendi (after door)
const pathToFendi = [
  [-8871.19,6152.95], [-9326.33,6862.55], [-10044.56,7921.78],
  [-8408.54,9475.41], [-10049.41,11259.31], [-11381.15,12387.01],
  [-12304.50,13319.24], [-14736.33,15054.21], [-15000,16850]
];

// Collect all points for bounds
const all = [
  ...blessing, ...pathBeforeFlag, ...partyPath, ...runnerTorchPath,
  ...brazierRoute, ...bossApproach, ...pathToFendi
];
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const [x, y] of all) {
  if (x < minX) minX = x; if (x > maxX) maxX = x;
  if (y < minY) minY = y; if (y > maxY) maxY = y;
}
const pad = 1500;
minX -= pad; maxX += pad; minY -= pad; maxY += pad;

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function tx(x) { return ((x - minX) / (maxX - minX)) * (W - 80) + 40; }
function ty(y) { return H - (((y - minY) / (maxY - minY)) * (H - 80) + 40); }

function drawPath(points, color, lineWidth, dashed) {
  if (points.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.setLineDash(dashed || []);
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const px = tx(points[i][0]), py = ty(points[i][1]);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawConnector(p1, p2, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(tx(p1[0]), ty(p1[1]));
  ctx.lineTo(tx(p2[0]), ty(p2[1]));
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPoints(points, color, radius, prefix) {
  for (let i = 0; i < points.length; i++) {
    const px = tx(points[i][0]), py = ty(points[i][1]);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(px, py, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (prefix) {
      ctx.fillStyle = '#ccc';
      ctx.font = '9px monospace';
      ctx.fillText(`${prefix}${i+1}`, px + radius + 2, py - radius);
    }
  }
}

function drawDiamond(point, color, label, size) {
  const px = tx(point[0]), py = ty(point[1]);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(px, py - size);
  ctx.lineTo(px + size, py);
  ctx.lineTo(px, py + size);
  ctx.lineTo(px - size, py);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = 'bold 10px monospace';
  ctx.fillText(label, px + size + 4, py + 4);
}

// Grid
ctx.strokeStyle = '#2a2a4a';
ctx.lineWidth = 0.5;
for (let gx = Math.ceil(minX / 5000) * 5000; gx <= maxX; gx += 5000) {
  const sx = tx(gx);
  ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.font = '9px monospace';
  ctx.fillText(gx.toString(), sx + 2, H - 4);
}
for (let gy = Math.ceil(minY / 5000) * 5000; gy <= maxY; gy += 5000) {
  const sy = ty(gy);
  ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.font = '9px monospace';
  ctx.fillText(gy.toString(), 2, sy - 2);
}

// Draw paths
drawPath(pathBeforeFlag, '#ff6b35', 2.5);
drawConnector(pathBeforeFlag[pathBeforeFlag.length-1], partyPath[0], '#888');
drawPath(partyPath, '#e63946', 2.5);
drawPath(runnerTorchPath, '#9b5de5', 2, [6, 3]);
drawPath(brazierRoute, '#ffd166', 2.5);
drawConnector(partyPath[partyPath.length-1], bossApproach[0], '#888');
drawPath(bossApproach, '#f77f00', 2);
drawConnector(bossApproach[bossApproach.length-1], pathToFendi[0], '#06d6a0');
drawPath(pathToFendi, '#06d6a0', 2.5);

// Draw points
drawPoints(pathBeforeFlag, '#ff6b35', 3.5, 'A');
drawPoints(partyPath, '#e63946', 4, 'P');
// Highlight strict-flank waypoints (forced 10s hold + aggressive PixelStack)
strictFlankIndices.forEach(i => {
  const pt = partyPath[i];
  const px = tx(pt[0]), py = ty(pt[1]);
  // Glow halo
  ctx.fillStyle = 'rgba(255, 235, 59, 0.35)';
  ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI*2); ctx.fill();
  // Yellow ring
  ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI*2); ctx.stroke();
  // Label
  ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 10px monospace';
  ctx.fillText(`STRICT`, px - 18, py - 14);
});
drawPoints(runnerTorchPath, '#9b5de5', 3, 'V');
drawPoints(brazierRoute, '#ffd166', 5, 'B');
drawPoints(bossApproach, '#f77f00', 4, 'X');
drawPoints(pathToFendi, '#06d6a0', 4, 'F');

// Key markers
drawDiamond(blessing[0], '#00b4d8', 'Blessing NPC', 8);
drawDiamond([16111, 17556], '#ffd166', 'Torch Chest', 7);
drawDiamond([-9252.32, 6396.40], '#f77f00', 'Boss Door', 7);
drawDiamond([-15000, 16850], '#06d6a0', 'Fendi', 8);
// New flanking points now part of partyPath — no separate marker needed

// Section labels
ctx.fillStyle = '#ff6b35'; ctx.font = 'bold 12px monospace';
ctx.fillText('Main Clear Path', tx(8000), ty(14000));
ctx.fillStyle = '#e63946';
ctx.fillText('Party Path (torch split)', tx(-6000), ty(6800));
ctx.fillStyle = '#ffd166';
ctx.fillText('Brazier Route (the torch runner)', tx(-8000), ty(1500));
ctx.fillStyle = '#06d6a0';
ctx.fillText('Path to Fendi', tx(-14000), ty(13000));

// Tooltip on hover showing game coords
const tooltip = document.getElementById('tooltip');
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const gx = minX + (mx - 40) / (W - 80) * (maxX - minX);
  const gy = maxY - (my - 40) / (H - 80) * (maxY - minY);
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top = (e.clientY + 12) + 'px';
  tooltip.textContent = `(${Math.round(gx)}, ${Math.round(gy)})`;
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
</script>
</body>
</html>
