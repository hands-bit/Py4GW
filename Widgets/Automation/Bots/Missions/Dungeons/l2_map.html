<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SoO L2 Coordinate Map</title>
<style>
body{background:#1a1a2e;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:monospace}
canvas{border:1px solid #444;cursor:crosshair}
#tooltip{position:fixed;background:rgba(0,0,0,0.85);color:#0f0;padding:6px 10px;border-radius:4px;font-size:13px;pointer-events:none;display:none;z-index:10}
#legend{position:fixed;top:10px;right:10px;background:rgba(0,0,0,0.8);color:#ccc;padding:10px;border-radius:6px;font-size:12px;line-height:1.8}
.leg{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle;border-radius:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="tooltip"></div>
<div id="legend">
<b>SoO Level 2</b><br>
<span class="leg" style="background:#4fc3f7"></span>Entry + Blessing<br>
<span class="leg" style="background:#ff9800"></span>Path to Torch<br>
<span class="leg" style="background:#f44336"></span>Brazier Route 1<br>
<span class="leg" style="background:#9c27b0"></span>L2 Cleaning<br>
<span class="leg" style="background:#ffeb3b"></span>Move to Room 2<br>
<span class="leg" style="background:#00e676"></span>Room 2 Path<br>
<span class="leg" style="background:#e91e63"></span>Brazier Route 2<br>
<span class="leg" style="background:#00bcd4"></span>After Brazier → Lock (Part 1)<br>
<span class="leg" style="background:#ff5722"></span>After Brazier → Lock (Part 2)<br>
<span class="leg" style="background:#fff"></span>Door + Portal<br>
</div>
<script>
const paths = [
  {name:"Entry + Blessing",color:"#4fc3f7",pts:[[-14076,-19457]]},
  {name:"Path to Torch",color:"#ff9800",pts:[[-11002,-17001],[-9259,-17322],[-9971.23,-17633.08],[-11136.85,-17201.66],[-11030.3,-17474],[-11303,-14596],[-14977.9,-16480.2],[-15985.6,-16838.1],[-16985.9,-16929.4]]},
  {name:"Brazier Route 1",color:"#f44336",pts:[[-11303,-14596],[-11019,-11550],[-9028,-9021],[-6805,-11511],[-8984,-13842]]},
  {name:"L2 Cleaning",color:"#9c27b0",pts:[[-7506.89,-12236.26],[-7435.12,-10649.25],[-9013.61,-9772.06],[-10324.58,-10434.43],[-10371.2,-12510.16],[-8836.63,-11471.01]]},
  {name:"Move to Room 2",color:"#ffeb3b",pts:[[-11061.1,-7578.5],[-11013.7,-6381.7]]},
  {name:"Room 2 Path",color:"#00e676",pts:[[-11013.7,-6381.7],[-11081.9,-5378.8],[-10071.6,-4396.5],[-9069.4,-4301.1],[-8066.1,-4222.4],[-7058.8,-4191],[-4245.2,-2101]]},
  {name:"Brazier Route 2",color:"#e91e63",pts:[[-3717,-4254],[-8251,-3240],[-8278,-1670]]},
  {name:"After Brazier Part 1",color:"#00bcd4",pts:[[-6798.8,-2436.4],[-9069.4,-4301.1],[-10071.6,-4396.5],[-11106.6,-4747.1],[-10970.9,-5754.5],[-11033.4,-6755.6]]},
  {name:"After Brazier Part 2",color:"#ff5722",pts:[[-11318,-7767.2],[-12320.7,-8417.1],[-13324,-8649],[-14326.3,-8773],[-15331,-8905.6],[-16335.1,-9004.5]]},
  {name:"Door + Portal",color:"#fff",pts:[[-18725,-9171],[-18610,-8636],[-19571.61,-8459]]}
];

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),tip=document.getElementById('tooltip');
const W=1000,H=800;canvas.width=W;canvas.height=H;
const allPts=paths.flatMap(p=>p.pts);
const xs=allPts.map(p=>p[0]),ys=allPts.map(p=>p[1]);
const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
const pad=40,rangeX=maxX-minX||1,rangeY=maxY-minY||1;
const scale=Math.min((W-2*pad)/rangeX,(H-2*pad)/rangeY);
const ox=pad+(W-2*pad-rangeX*scale)/2, oy=pad+(H-2*pad-rangeY*scale)/2;
function tx(x){return ox+(x-minX)*scale}
function ty(y){return oy+(y-minY)*scale}

function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#333';ctx.lineWidth=0.5;
  for(let x=Math.ceil(minX/2000)*2000;x<=maxX;x+=2000){
    const sx=tx(x);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
    ctx.fillStyle='#555';ctx.font='10px monospace';ctx.fillText(x,sx+2,H-4);
  }
  for(let y=Math.ceil(minY/2000)*2000;y<=maxY;y+=2000){
    const sy=ty(y);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
    ctx.fillStyle='#555';ctx.font='10px monospace';ctx.fillText(y,4,sy-2);
  }
  // paths
  paths.forEach((p,pi)=>{
    ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.setLineDash(pi>=7?[6,4]:[]);
    if(p.pts.length>1){ctx.beginPath();ctx.moveTo(tx(p.pts[0][0]),ty(p.pts[0][1]));
    for(let i=1;i<p.pts.length;i++)ctx.lineTo(tx(p.pts[i][0]),ty(p.pts[i][1]));ctx.stroke();}
    ctx.setLineDash([]);
    // dots + labels
    p.pts.forEach((pt,i)=>{
      const x=tx(pt[0]),y=ty(pt[1]);
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ccc';ctx.font='9px monospace';
      ctx.fillText(`${i+1}`,x+6,y-4);
    });
  });
}
draw();

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const gx=((mx-ox)/scale+minX).toFixed(0);
  const gy=((my-oy)/scale+minY).toFixed(0);
  // find nearest point
  let best=null,bestD=Infinity;
  paths.forEach(p=>p.pts.forEach(pt=>{
    const d=Math.hypot(tx(pt[0])-mx,ty(pt[1])-my);
    if(d<bestD){bestD=d;best={pt,name:p.name};}
  }));
  let text=`(${gx}, ${gy})`;
  if(best&&bestD<15)text+=` | ${best.name}: (${best.pt[0]}, ${best.pt[1]})`;
  tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.textContent=text;
});
canvas.addEventListener('mouseleave',()=>tip.style.display='none');
</script></body></html>
