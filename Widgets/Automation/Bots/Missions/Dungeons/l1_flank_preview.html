<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>L1 Flank Preview + Run Overlay</title>
<style>
body{margin:0;background:#1a1a2e;font-family:monospace;color:#eee}
h1{text-align:center;margin:10px 0 0;font-size:18px}
.legend{display:flex;justify-content:center;gap:16px;padding:8px;font-size:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
canvas{display:block;margin:0 auto;cursor:crosshair}
#tooltip{position:fixed;background:rgba(0,0,0,0.85);color:#fff;padding:4px 8px;font-size:11px;border-radius:4px;pointer-events:none;display:none}
</style></head><body>
<h1>L1 Flank — Current Route + Actual Run End Positions</h1>
<div class="legend">
  <span><span class="dot" style="background:#ff6b35"></span> path_before_flank (A1-A5)</span>
  <span><span class="dot" style="background:#00e676"></span> flank target (-5348, 12751)</span>
  <span><span class="dot" style="background:#e63946"></span> path_after_flank</span>
  <span><span class="dot" style="background:#ffd166"></span> Spirit disable @A2</span>
  <span><span class="dot" style="background:#9b5de5"></span> Spirit re-enable</span>
  <span><span class="dot" style="background:#f44336"></span> Run end positions (timeout)</span>
</div>
<canvas id="map" width="1400" height="800"></canvas>
<div id="tooltip"></div>
<script>
// path_before_flank — A1 through A5
const pathBeforeFlank = [
  [-11685.5, 10475.5],  // A1
  [-10682.6, 9841.2],   // A2 — spirit disable happens right after this
  [-9670.9, 9744.2],    // A3
  [-8661.9, 9975.7],    // A4
  [-7653.5, 10063.4],   // A5 — flank push starts here
];

// Flank target (single point)
const flankTarget = [-5348.0, 12751.0];

// path_after_flank — first point is where spirits re-enable
const pathAfterFlank = [
  [-3640.8, 11984.6],   // spirit re-enable
  [-2634.2, 12702.1],
  [-1630.8, 13315.2],
  [-628.5, 14075.6],
  [379.8, 14700.8],
  [1384.7, 15324.0],
  [2394.5, 15950.3],
  [3409.5, 15710.4],
  [4157.9, 14705.9],
  [5089.4, 13698.1],
  [6090.8, 13172.6],
  [7091.1, 13482.8],
  [8093.3, 13148.6],
  [8503.9, 12143.5],
  [7496.9, 11676.0],
  [6494.3, 10739.2],
];

// Actual L1_FLANK_PUSH_END positions from 5 logged runs
const runEndPositions = [
  {run: 1, pos: [-6903.6, 9770.8], dist: 3362},
  {run: 2, pos: [-6842.5, 9882.1], dist: 3235},
  {run: 3, pos: [-5670.2, 11856.6], dist:  951},
  {run: 4, pos: [-6172.5, 10584.5], dist: 2318},
  {run: 5, pos: [-5457.0, 12324.0], dist:  441},
];

const allPts = [...pathBeforeFlank, flankTarget, ...pathAfterFlank, ...runEndPositions.map(r => r.pos)];
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
for(const[x,y] of allPts){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
const pad=1500;minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;

const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
function tx(x){return((x-minX)/(maxX-minX))*(W-80)+40}
function ty(y){return H-(((y-minY)/(maxY-minY))*(H-80)+40)}

// Grid
ctx.strokeStyle='#2a2a4a';ctx.lineWidth=0.5;
for(let gx=Math.ceil(minX/1000)*1000;gx<=maxX;gx+=1000){
  const sx=tx(gx);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
  ctx.fillStyle='#555';ctx.font='9px monospace';ctx.fillText(gx,sx+2,H-4);
}
for(let gy=Math.ceil(minY/1000)*1000;gy<=maxY;gy+=1000){
  const sy=ty(gy);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
  ctx.fillStyle='#555';ctx.font='9px monospace';ctx.fillText(gy,2,sy-2);
}

// 300-unit arrived-radius circle around target (for reference — push stops when the torch runner inside this)
const arrivedRadiusPx = (300 / (maxX - minX)) * (W - 80);
ctx.beginPath();
ctx.arc(tx(flankTarget[0]), ty(flankTarget[1]), arrivedRadiusPx, 0, Math.PI*2);
ctx.strokeStyle = 'rgba(0,230,118,0.3)';
ctx.lineWidth = 1.5;
ctx.setLineDash([3,3]);
ctx.stroke();
ctx.setLineDash([]);

// path_before_flank
ctx.strokeStyle='#ff6b35';ctx.lineWidth=2.5;ctx.beginPath();
for(let i=0;i<pathBeforeFlank.length;i++){
  const px=tx(pathBeforeFlank[i][0]),py=ty(pathBeforeFlank[i][1]);
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.stroke();

// Flank connector — A5 -> flank target (dashed green, this is the push)
ctx.strokeStyle='#00e676';ctx.lineWidth=3;ctx.setLineDash([8,4]);ctx.beginPath();
ctx.moveTo(tx(pathBeforeFlank[4][0]), ty(pathBeforeFlank[4][1]));
ctx.lineTo(tx(flankTarget[0]), ty(flankTarget[1]));
ctx.stroke();
ctx.setLineDash([]);

// flank target -> path_after_flank[0]
ctx.strokeStyle='#9b5de5';ctx.lineWidth=2;ctx.setLineDash([6,3]);ctx.beginPath();
ctx.moveTo(tx(flankTarget[0]), ty(flankTarget[1]));
ctx.lineTo(tx(pathAfterFlank[0][0]), ty(pathAfterFlank[0][1]));
ctx.stroke();
ctx.setLineDash([]);

// path_after_flank
ctx.strokeStyle='#e63946';ctx.lineWidth=2;ctx.beginPath();
for(let i=0;i<pathAfterFlank.length;i++){
  const px=tx(pathAfterFlank[i][0]),py=ty(pathAfterFlank[i][1]);
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.stroke();

// Points
function drawPt(pt, color, radius, label){
  const px=tx(pt[0]),py=ty(pt[1]);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,radius,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
  if(label){
    ctx.fillStyle='#ccc';ctx.font='10px monospace';
    ctx.fillText(label,px+radius+3,py-radius);
  }
}

// Before-flank waypoints with labels
pathBeforeFlank.forEach((pt,i)=>{
  const isA2 = i===1;
  const isA5 = i===4;
  drawPt(pt, isA2 ? '#ffd166' : (isA5 ? '#00e676' : '#ff6b35'),
         isA2||isA5 ? 6 : 4,
         isA2 ? `A${i+1} spirit_disable` : (isA5 ? `A${i+1} push_start` : `A${i+1}`));
});

// Flank target
drawPt(flankTarget, '#00e676', 8, `TARGET (${flankTarget[0]}, ${flankTarget[1]})`);

// After-flank waypoints (first one highlighted as re-enable point)
pathAfterFlank.forEach((pt,i)=>{
  drawPt(pt, i===0 ? '#9b5de5' : '#e63946', i===0 ? 6 : 4, i===0 ? 'spirit_reenable' : `B${i+1}`);
});

// Run end positions — red markers with run number
runEndPositions.forEach(r => {
  const px=tx(r.pos[0]),py=ty(r.pos[1]);
  // Draw connecting line from push start (A5) to end pos
  ctx.strokeStyle='rgba(244,67,54,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(tx(pathBeforeFlank[4][0]), ty(pathBeforeFlank[4][1]));
  ctx.lineTo(px, py);
  ctx.stroke();
  ctx.setLineDash([]);
  // Glow
  ctx.fillStyle='rgba(244,67,54,0.25)';ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fill();
  // Marker
  ctx.fillStyle='#f44336';ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();
  // Label
  ctx.fillStyle='#f44336';ctx.font='bold 11px monospace';
  ctx.fillText(`Run ${r.run} end (${r.dist}u from target)`, px+10, py+4);
});

// Tooltip
const tooltip=document.getElementById('tooltip');
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const gx=minX+(mx-40)/(W-80)*(maxX-minX);
  const gy=maxY-(my-40)/(H-80)*(maxY-minY);
  tooltip.style.display='block';tooltip.style.left=e.clientX+12+'px';tooltip.style.top=e.clientY+12+'px';
  tooltip.textContent=`(${Math.round(gx)}, ${Math.round(gy)})`;
});
canvas.addEventListener('mouseleave',()=>tooltip.style.display='none');
</script></body></html>
