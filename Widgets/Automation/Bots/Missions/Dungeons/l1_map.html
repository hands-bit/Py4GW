<!DOCTYPE html>
<html>
<head>
<title>SoO Level 1 - 2D Map</title>
<style>
  body { margin: 0; background: #1a1a2e; font-family: monospace; color: #eee; }
  h1 { text-align: center; margin: 10px 0 0; font-size: 18px; color: #e0e0e0; }
  .legend { display: flex; justify-content: center; gap: 20px; padding: 8px; font-size: 12px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<h1>Shards of Orr Level 1 — Full Route</h1>
<div class="legend">
  <span><span class="dot" style="background:#00b4d8"></span> Blessing + Entry</span>
  <span><span class="dot" style="background:#ff6b35"></span> Path Before Bridgant (24 pts)</span>
  <span><span class="dot" style="background:#e63946"></span> Path Before Door (12 pts)</span>
  <span><span class="dot" style="background:#9b5de5"></span> Path Before Door 2 (7 pts)</span>
  <span><span class="dot" style="background:#f77f00"></span> Path After Door (5 pts) — no combat</span>
  <span><span class="dot" style="background:#06d6a0"></span> Path to Portal (4 pts)</span>
  <span><span class="dot" style="background:#2ec4b6;border-radius:0;width:12px;height:12px;transform:rotate(45deg)"></span> Secure Return Checkpoints</span>
  <span><span class="dot" style="background:#ffd166;border-radius:0;width:12px;height:12px;transform:rotate(45deg)"></span> Key Interactions</span>
</div>
<canvas id="map" width="1200" height="800"></canvas>
<script>
// Entry/blessing
const blessing = [[-11686, 10427]];

// Path segments
const pathBeforeBridgant = [
  [-11685.5,10475.5], [-10682.6,9841.2], [-9670.9,9744.2], [-8661.9,9975.7],
  [-7653.5,10063.4], [-6652.0,10156.2], [-5646.1,10717.7], [-4642.3,11376.3],
  [-3640.8,11984.6], [-2634.2,12702.1], [-1630.8,13315.2], [-628.5,14075.6],
  [379.8,14700.8], [1384.7,15324.0], [2394.5,15950.3], [3409.5,15710.4],
  [4157.9,14705.9], [5089.4,13698.1], [6090.8,13172.6], [7091.1,13482.8],
  [8093.3,13148.6], [8503.9,12143.5], [7496.9,11676.0], [6494.3,10739.2]
];

const pathBeforeDoor = [
  [9196.0,11484.4], [10196.0,12469.4], [11198.7,13401.8], [12201.3,14284.4],
  [13202.8,15176.3], [14207.0,16116.2], [15208.8,16871.6], [16213.2,16417.3],
  [16643.4,15416.6], [16994.9,14410.6], [17115.6,13405.6], [16689.2,12400.4]
];

const secureReturn1 = [8503.9, 12143.5]; // in pathBeforeBridgant
const moveToSR2 = [15953, 11902];

const pathBeforeDoor2 = [
  [15927.4,11684.7], [16037.8,10679.9], [15761.1,9679.7], [15289.5,8672.6],
  [14447.3,7672.0], [14526.2,6664.2], [14951.6,5657.9]
];

const doorInteract = [15100, 5443];

const pathAfterDoor = [
  [15364.9,4858.7], [15689.5,3857.7], [16026.7,2857.1], [17030.7,2262.6],
  [18035.7,1888.8]
];

const pathToPortal = [
  [19037.1,1384.6], [19679.2,1009.5], [20181.6,1203.7], [20400.5,1300]
];

// Collect all points for bounds
const all = [
  ...blessing, ...pathBeforeBridgant, ...pathBeforeDoor,
  [moveToSR2[0], moveToSR2[1]], ...pathBeforeDoor2, [doorInteract[0], doorInteract[1]],
  ...pathAfterDoor, ...pathToPortal
];
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const [x, y] of all) {
  if (x < minX) minX = x; if (x > maxX) maxX = x;
  if (y < minY) minY = y; if (y > maxY) maxY = y;
}
const pad = 1500;
minX -= pad; maxX += pad; minY -= pad; maxY += pad;

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function tx(x) { return ((x - minX) / (maxX - minX)) * (W - 80) + 40; }
function ty(y) { return H - (((y - minY) / (maxY - minY)) * (H - 80) + 40); }

function drawPath(points, color, lineWidth, dashed) {
  if (points.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.setLineDash(dashed || []);
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const px = tx(points[i][0]), py = ty(points[i][1]);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawConnector(p1, p2, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(tx(p1[0]), ty(p1[1]));
  ctx.lineTo(tx(p2[0]), ty(p2[1]));
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPoints(points, color, radius, prefix) {
  for (let i = 0; i < points.length; i++) {
    const px = tx(points[i][0]), py = ty(points[i][1]);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(px, py, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (prefix) {
      ctx.fillStyle = '#ccc';
      ctx.font = '9px monospace';
      ctx.fillText(`${prefix}${i+1}`, px + radius + 2, py - radius);
    }
  }
}

function drawDiamond(point, color, label, size) {
  const px = tx(point[0]), py = ty(point[1]);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(px, py - size);
  ctx.lineTo(px + size, py);
  ctx.lineTo(px, py + size);
  ctx.lineTo(px - size, py);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = 'bold 10px monospace';
  ctx.fillText(label, px + size + 4, py + 4);
}

// Grid
ctx.strokeStyle = '#2a2a4a';
ctx.lineWidth = 0.5;
for (let gx = Math.ceil(minX / 5000) * 5000; gx <= maxX; gx += 5000) {
  const sx = tx(gx);
  ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.font = '9px monospace';
  ctx.fillText(gx.toString(), sx + 2, H - 4);
}
for (let gy = Math.ceil(minY / 5000) * 5000; gy <= maxY; gy += 5000) {
  const sy = ty(gy);
  ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.font = '9px monospace';
  ctx.fillText(gy.toString(), 2, sy - 2);
}

// Draw paths
drawPath(pathBeforeBridgant, '#ff6b35', 2.5);
drawConnector(pathBeforeBridgant[pathBeforeBridgant.length-1], pathBeforeDoor[0], '#888');
drawPath(pathBeforeDoor, '#e63946', 2.5);
drawConnector(pathBeforeDoor[pathBeforeDoor.length-1], [moveToSR2[0], moveToSR2[1]], '#888');
drawConnector([moveToSR2[0], moveToSR2[1]], pathBeforeDoor2[0], '#888');
drawPath(pathBeforeDoor2, '#9b5de5', 2.5);
drawConnector(pathBeforeDoor2[pathBeforeDoor2.length-1], [doorInteract[0], doorInteract[1]], '#888');
drawConnector([doorInteract[0], doorInteract[1]], pathAfterDoor[0], '#f77f00');
drawPath(pathAfterDoor, '#f77f00', 2.5);
drawConnector(pathAfterDoor[pathAfterDoor.length-1], pathToPortal[0], '#06d6a0');
drawPath(pathToPortal, '#06d6a0', 2.5);

// Draw points
drawPoints(blessing, '#00b4d8', 7, null);
drawPoints(pathBeforeBridgant, '#ff6b35', 4, 'A');
drawPoints(pathBeforeDoor, '#e63946', 4, 'B');
drawPoints(pathBeforeDoor2, '#9b5de5', 4, 'C');
drawPoints(pathAfterDoor, '#f77f00', 4, 'D');
drawPoints(pathToPortal, '#06d6a0', 4, 'E');

// Key markers
drawDiamond(blessing[0], '#00b4d8', 'Blessing NPC', 8);
drawDiamond(secureReturn1, '#2ec4b6', 'SR1 (8504, 12144)', 7);
drawDiamond(moveToSR2, '#2ec4b6', 'SR2 (15953, 11902)', 7);
drawDiamond(doorInteract, '#ffd166', 'Door (15100, 5443)', 7);
drawDiamond(pathToPortal[pathToPortal.length-1], '#06d6a0', 'Portal to L2', 8);

// Section labels
ctx.fillStyle = '#ff6b35'; ctx.font = 'bold 12px monospace';
ctx.fillText('Path Before Bridgant', tx(-5000), ty(14500));
ctx.fillStyle = '#e63946';
ctx.fillText('Path Before Door', tx(12000), ty(16800));
ctx.fillStyle = '#9b5de5';
ctx.fillText('Path Before Door 2', tx(13000), ty(8000));
ctx.fillStyle = '#f77f00';
ctx.fillText('After Door (no combat)', tx(15500), ty(3500));
ctx.fillStyle = '#06d6a0';
ctx.fillText('To Portal', tx(19000), ty(2000));
</script>
</body>
</html>
